<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Reset Code - SariServe</title>
  </head>

  <body class="bg-slate-100 font-poppins min-h-screen flex items-center justify-center m-0">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-10">
      <h2 class="text-xl font-bold text-slate-700 mb-2 text-center">Verification Code</h2>
      <p id="reset-code-subtitle" class="text-sm text-slate-500 mb-8 text-center">
        Ilagay ang reset code na ipinadala namin sa email mo.
      </p>

      <form id="reset-code-form">
        <div class="flex justify-center gap-3 mb-2">
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-12 h-14 border border-slate-300 rounded-lg text-center text-xl font-semibold focus:outline-none focus:border-slate-600" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-12 h-14 border border-slate-300 rounded-lg text-center text-xl font-semibold focus:outline-none focus:border-slate-600" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-12 h-14 border border-slate-300 rounded-lg text-center text-xl font-semibold focus:outline-none focus:border-slate-600" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-12 h-14 border border-slate-300 rounded-lg text-center text-xl font-semibold focus:outline-none focus:border-slate-600" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-12 h-14 border border-slate-300 rounded-lg text-center text-xl font-semibold focus:outline-none focus:border-slate-600" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-12 h-14 border border-slate-300 rounded-lg text-center text-xl font-semibold focus:outline-none focus:border-slate-600" />
        </div>

        <p id="reset-code-message" class="text-center text-sm mt-4 mb-4"></p>

        <button type="submit" class="w-full bg-slate-700 text-white rounded-full py-2.5 text-sm font-medium hover:bg-slate-800 transition">
          Verify
        </button>
      </form>
    </div>
  </body>

  <script type="module" src="/src/main.js"></script>
</html>
