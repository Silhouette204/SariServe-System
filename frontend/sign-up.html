<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <title>Sign Up - SariServe</title>
  </head>

  <body class="bg-slate-100 font-poppins min-h-screen flex items-center justify-center m-0 py-8">
  
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row m-4 md:min-h-[600px]">
      
      <!-- Left Side: Image Panel -->
      <div class="hidden md:flex w-full md:w-1/2 relative flex-col items-center justify-end p-8 overflow-hidden rounded-l-2xl">
        <img src="./public/sign-up-img.jpg" class="absolute inset-0 w-full h-full object-cover opacity-80" alt="Sign up illustration">
        <div class="absolute inset-0 bg-black/10"></div>
      
        <div class="relative z-10 text-center mb-6 text-white">
          <h3 class="text-xl font-bold mb-2">Sari-Serve Account Creation</h3>
          <p class="text-xs text-slate-100 opacity-90 max-w-xs">
            SariServe: Kaagapay Mo sa Pagpapalago ng Iyong Negosyo.
          </p>
        </div>
      </div>

      <!-- Right Side: Form Panel -->
      <div class="w-full md:w-1/2 bg-white p-8 md:p-12 flex flex-col justify-center">
        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold italic text-slate-700">Create your own Account</h2>
          <p class="text-xs text-slate-400 mt-1">Create Account to start assisting your store.</p>
        </div>

        <form class="space-y-4 my-5">
          <div class="flex flex-row gap-3 justify-between items-center">
            <div class="w-1/2">
              <label class="block text-xs font-medium text-slate-500 mb-1">Firstname</label>
              <input id="user-create-firstname" type="text" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
            </div>

            <div class="w-1/2">
              <label class="block text-xs font-medium text-slate-500 mb-1">Lastname</label>
              <input id="user-create-lastname" type="text" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
            <input id="user-create-email" type="email" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Phone Number</label>
            <input id="user-create-phone" type="tel" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
          </div>

          <div class="flex flex-col gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Create Password</label>
              <input id="user-create-password" type="password" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Confirm Password</label>
              <input id="user-create-confirm-password" type="password" autocomplete="new-password" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
            </div>
          </div>

           <!-- Notification Preferences Radio Buttons -->
           <div class="my-7">
            <label class="block text-xs font-medium text-slate-500 mb-1">Notification Preference</label>
            <div class="flex items-center gap-6 pt-1">
              <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
                <input type="radio" name="notification_pref" value="email" class="accent-slate-700" checked /> Email
              </label>
              <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
                <input type="radio" name="notification_pref" value="phone" class="accent-slate-700" /> Phone Number
              </label>
            </div>
          </div>


          <!-- Terms and Agreement Checkbox -->
          <div class="flex items-center gap-2 pt-1">
            <input type="checkbox" id="terms" required class="w-4 h-4 rounded border-slate-300 accent-slate-700 cursor-pointer" />
            <label for="terms" class="text-xs text-slate-500 cursor-pointer">
              I agree to the <a href="#" class="text-slate-700 font-medium hover:underline">Terms and Conditions</a>
            </label>
          </div>

          <button type="submit" class="w-full my-5 bg-slate-700 text-white rounded-full py-2.5 text-sm font-medium hover:bg-slate-800 transition">
            Create Account
          </button>
        </form>

        <div class="relative flex py-4 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-4 text-slate-400 text-xs">or</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <button class="w-full border border-slate-200 rounded-full py-2 text-sm font-medium flex items-center justify-center gap-2 hover:bg-slate-50 transition text-slate-600">
          <i class="fa-brands fa-google text-red-500"></i> Sign in with Google
        </button>

        <p class="text-center text-xs text-slate-500 mt-6">
          Already have an account? <a href="sign-in.html" class="text-slate-700 font-medium hover:underline">Login</a>
        </p>
      </div>

    </div>

  </body>

  <script type="module" src="/src/main.js"></script>
</html>
