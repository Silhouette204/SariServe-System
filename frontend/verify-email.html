<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <title>Signing In - SariServe</title>
  </head>

  <body class="bg-slate-100 font-poppins min-h-screen flex items-center justify-center m-0">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-10">
      <h2 class="text-xl font-bold text-slate-700 mb-2 text-center">I-verify ang Email Mo</h2>
      <p class="text-sm text-slate-500 mb-6 text-center">Ilagay ang 6-digit code na ipinadala namin sa email mo.</p>

      <form id="verify-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
          <input id="verify-email" type="email" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">6-Digit Code</label>
          <input id="verify-code" type="text" maxlength="6" inputmode="numeric" class="w-full border-b border-slate-300 py-1 text-sm text-center tracking-widest focus:outline-none focus:border-slate-600 bg-transparent" />
        </div>
        <button type="submit" class="w-full bg-slate-700 text-white rounded-full py-2.5 text-sm font-medium hover:bg-slate-800 transition">
          Verify
        </button>
      </form>

      <p id="verify-message" class="text-center text-sm mt-4"></p>
    </div>
  </body>
    
  <script type="module" src="/src/main.js"></script>
</html>
