<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <title>Main - SariServe</title>
  </head>

  <body class="bg-slate-100 font-poppins h-screen flex items-center justify-center m-0">
  
    <div class="w-full  max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row m-4 md:min-h-[600px]">
      
      <div class="hidden md:flex w-full md:w-1/2 relative flex-col items-center justify-end p-8 overflow-hidden rounded-l-2xl">
  
        <img src="./public/sign-in-img.jpg" class="absolute inset-0 w-full h-full object-cover" alt="Sign in illustration">
        
        <div class="absolute inset-0 bg-black/10"></div>
      
        <div class="relative z-10 text-center mb-6 text-white">
          <h3 class="text-xl font-bold mb-2">Sari-Serve</h3>
          <p class="text-xs text-slate-100 opacity-90 max-w-xs">
            SariServe: Kaagapay Mo sa Pagpapalago ng Iyong Negosyo.
          </p>
        </div>
        
      </div>

      <div class="w-full md:w-1/2 bg-white p-8 md:p-12 flex flex-col justify-center">
        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold italic text-slate-700">Sari-Serve Log-In</h2>
          <p class="text-xs text-slate-400 mt-1">We Serve, We Solve</p>
        </div>

        <form class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Users name or Email</label>
            <input type="text" value="" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Password</label>
            <input type="password" value="" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
            <div class="text-right mt-1">
              <a href="#" class="text-[10px] text-slate-400 hover:underline">Forgot password?</a>
            </div>
          </div>

          <button type="submit" class="w-full bg-slate-700 text-white rounded-full py-2.5 text-sm font-medium hover:bg-slate-800 transition">
            Sign in
          </button>
        </form>

        <div class="relative flex py-4 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-4 text-slate-400 text-xs">or</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <button class="w-full border border-slate-200 rounded-full py-2 text-sm font-medium flex items-center justify-center gap-2 hover:bg-slate-50 transition text-slate-600">
          <i class="fa-brands fa-google text-red-500"></i> Sign in with Google
        </button>

        <div class="flex flex-row justify-between items-center">

        <p class="text-center text-xs text-secondary/80 mt-6">
          New Store? <a href="sign-up.html" class="text-slate-700 font-medium hover:underline">Create Account</a>
        </p>

        <p class="text-xs mt-6 text-secondary/80">Go Back to <a href="./index.html" class="text-black font-semibold hover:underline">Landing Page</a></span> </a></p>
      </div>
      </div>

    </div>

  </body>

  <script type="module" src="/src/main.js"></script>
</html>
