<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <title>Forget Password - SariServe</title>
  </head>

  <body class="bg-slate-100 font-poppins h-screen flex items-center justify-center m-0">
  
    <div class="w-full  max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row m-4 md:min-h-[600px]">
      
      <div class="hidden md:flex w-full md:w-1/2 relative flex-col items-center justify-end p-8 overflow-hidden rounded-l-2xl">
  
        <img src="./public/forgot-password-img.png" class="opacity-80 absolute inset-0 w-full h-full object-cover" alt="Sign in illustration">
        
        <div class="absolute inset-0 bg-black/10"></div>
      
        <div class="relative z-10 text-center mb-6 text-white">
          <h3 class="text-xl font-bold mb-2 text-black">Sari-Serve</h3>
          <p class="text-xs text-black opacity-90 max-w-xs">
            SariServe: Kaagapay Mo sa Pagpapalago ng Iyong Negosyo.
          </p>
        </div>
        
      </div>

      <div class="w-full md:w-1/2 bg-white p-8 md:p-12 flex flex-col justify-center">

        <div class="flex justify-end my-2">
        <a href="./index.html"><i class="fa-solid fa-xmark text-secondary text-lg hover:bg-secondary/30 rounded-full py-1 px-2 cursor-pointer transition"></i></a>
      </div>

      <div class="flex justify-center items-center">
  <img src="./public/forgot-passowrd-icon.png" class="h-34 w-34 my-3" alt="">
      </div>

        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold italic text-slate-700">Forgot Password</h2>
          <p class="text-xs text-slate-400 my-3 mx-6">This feature lets you reset your account access by sending a secure verification link or code to your registered email or phone number.</p>
        </div>

        <form class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
            <input type="text" id="sign-in-username" name="username" autocomplete="off" class="w-full border-b border-slate-300 py-1 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
          </div>


          <button type="submit" id="email-submit-forgot-pass" class="w-full bg-slate-700 text-white rounded-full py-2.5 text-sm font-medium hover:bg-slate-800 transition">
            Send Email
          </button>
        </form>

        <div class="flex flex-row justify-center items-center mt-3">

        <p class="text-center text-sm text-secondary/80 mt-6">
       <a href="sign-in.html" class="text-secondary font-medium hover:underline"><span class="mr-2"> </span>Back to Login Account</a>
        </p>
        
    </div>
      </div>

    </div>

  </body>

  <script type="module" src="/src/main.js"></script>
  </html>
