<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <title>Confirmation Password - SariServe</title>
  </head>

  <body class="bg-slate-100 font-poppins min-h-screen flex items-center justify-center m-0 pb-5">
  
    <div class="w-full  max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row m-4 md:min-h-[600px]">
      
      <div class="hidden md:flex w-full md:w-1/2 relative flex-col items-center justify-end p-8 overflow-hidden rounded-l-2xl">
  
        <img src="./public/forgot-password-img.png" class="opacity-80 absolute inset-0 w-full h-full object-cover" alt="Sign in illustration">
        
        <div class="absolute inset-0 bg-black/10"></div>
      
        <div class="relative z-10 text-center mb-6 text-white">
          <h3 class="text-xl font-bold mb-2 text-black">Sari-Serve</h3>
          <p class="text-xs text-black opacity-90 max-w-xs">
            SariServe: Kaagapay Mo sa Pagpapalago ng Iyong Negosyo.
          </p>
        </div>
        
      </div>

      <div class="w-full md:w-1/2 bg-white p-8 md:p-12 flex flex-col justify-center">

      <div class="flex justify-center items-center">
  <img src="./public/confirm-password-icon.png" class="h-54 w-54" alt="">
      </div>

        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold italic text-slate-700">Confirm your Password</h2>
          <p id="confirm-subtitle" class="text-xs text-slate-400 my-3 mx-6">This feature requires you to type your password a second time to ensure there are no spelling mistakes.</p>
        </div>

        <form id="confirm-form" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">New Password</label>
            <div class="relative">
              <input type="password" id="confirm-new-password" name="newPassword" autocomplete="new-password" class="w-full border-b border-slate-300 py-1 pr-7 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
              <button type="button" class="password-toggle-btn absolute right-0 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" data-target="confirm-new-password">
                <i class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>

            <div class="mt-2">
              <div class="h-2 w-full rounded-full bg-slate-200 overflow-hidden">
                <div data-pw-bar class="h-full w-0 transition-all duration-300"></div>
              </div>
              <p data-pw-label class="text-xs font-semibold mt-1 h-4"></p>
            </div>
          </div>

        
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Confirm Password</label>
            <div class="relative">
              <input type="password" id="confirm-repeat-password" name="repeatPassword" autocomplete="new-password" class="w-full border-b border-slate-300 py-1 pr-7 text-sm focus:outline-none focus:border-slate-600 bg-transparent" />
              <button type="button" class="password-toggle-btn absolute right-0 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" data-target="confirm-repeat-password">
                <i class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>

            <ul data-pw-checklist class="mt-3 flex flex-col gap-1 text-xs text-slate-500">
              <li data-rule="length"><i class="fa-regular fa-circle mr-2"></i>At least 8 characters</li>
              <li data-rule="upper"><i class="fa-regular fa-circle mr-2"></i>1 uppercase letter</li>
              <li data-rule="number"><i class="fa-regular fa-circle mr-2"></i>1 number</li>
              <li data-rule="special"><i class="fa-regular fa-circle mr-2"></i>1 special character</li>
            </ul>
          </div>
        
          <button type="submit" id="confirm-submit" class="w-full bg-slate-700 text-white rounded-full py-2.5 text-sm font-medium hover:bg-slate-800 transition">
            Submit
          </button>
        </form>
        
        <p  id="confirm-message" class="text-center text-sm mt-4"></p>

      </div>

    </div>

  </body>

  <script type="module" src="/src/main.js"></script>
  </html>
